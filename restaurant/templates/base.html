{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Lemon - {% block title %}Restaurant{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header>
    <a href="{% url 'home' %}" class="logo">
      <svg viewBox="0 0 60 70" width="56" height="64" aria-hidden="true">
        <ellipse cx="30" cy="42" rx="22" ry="24" fill="#495E57" transform="rotate(-20 30 42)"/>
        <path d="M30 18 C34 6 46 4 50 8 C48 18 38 20 30 18Z" fill="#495E57"/>
      </svg>
      <span>LITTLE LEMON</span>
    </a>
  </header>
  <nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'about' %}">About</a>
    <a href="{% url 'menu' %}">Menu</a>
    <a href="{% url 'book' %}">Book</a>
    <a href="{% url 'reservations' %}">Reservations</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer><p>Copyright Little Lemon</p></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
